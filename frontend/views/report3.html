<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report 3 - Courses</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/admin.css" />
    <link rel="stylesheet" href="/css/navbar.css" />
    <link rel="stylesheet" href="/css/forms.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header class="navbar" id="navbar"></header>
    <main>
      <h2 class="section-title">Report 3: Course Performance</h2>
      <p class="section-subtitle">คอร์สยอดนิยมและรายได้รวมต่อเดือน</p>
      <section class="report">
        <h3>Popular Courses</h3>
        <table id="courses">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Course</th>
              <th>Level</th>
              <th>Enrollments</th>
              <th>Revenue</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
      <section class="report">
        <h3>Monthly Course Revenue</h3>
        <canvas id="courseRevenueChart"></canvas>
      </section>
    </main>
    <script src="/js/global.js"></script>
    <script src="/js/report3.js"></script>
  </body>
</html>
