<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SheSparks Testing</title>
  <link rel="stylesheet" href="/css/global.css">
  <style>
    body { padding: 40px; }
    h1 { color: var(--pink-deep); margin-bottom: 20px; }
    h2 { color: var(--pink-deep); margin-top: 30px; margin-bottom: 16px; font-size: 1.2rem; }
    .test-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; background: white;
      border-radius: 10px; margin-bottom: 8px;
      border: 1px solid var(--border);
    }
    .test-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--pink-main); }
    .test-item label { flex: 1; cursor: pointer; }
    .test-item .status { font-size: 0.8rem; padding: 4px 10px; border-radius: 50px; }
    .status.pass { background: #e8f5e9; color: #4caf50; }
    .status.fail { background: #ffebee; color: #f44336; }
    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
    .btn-group a { padding: 10px 20px; background: var(--pink-main); color: white; text-decoration: none; border-radius: 50px; font-size: 0.9rem; }
    .btn-group a:hover { background: var(--pink-deep); }
  </style>
</head>
<body>

  <h1>🧪 SheSparks Testing Checklist</h1>
  <p style="color: var(--text-mid);">ใช้ไฟล์นี้เพื่อ track การทดสอบทั้งหมด</p>

  <div class="btn-group">
    <a href="/views/index.html">🏠 Home</a>
    <a href="/views/login.html">🔐 Login</a>
    <a href="/views/admin.html">👑 Admin</a>
    <a href="/views/trainer-dashboard.html">🏋️ Trainer</a>
    <a href="/views/manager-dashboard.html">🏢 Manager</a>

  <div class="test-item"><input type="checkbox" id="t3"><label for="t3">Admin A001/admin → admin.html</label></div>

</html>
