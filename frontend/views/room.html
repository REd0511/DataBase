<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking - Select Room</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/navbar.css" />
    <link rel="stylesheet" href="/css/forms.css" />
    <link rel="stylesheet" href="/css/booking-flow.css" />
    <link rel="stylesheet" href="/css/room.css" />
    <link rel="stylesheet" href="/css/modal.css" />
  </head>

  <body>
    <header class="navbar" id="navbar"></header>

    <main>
      <h2 class="section-title">Book Your Room</h2>

      <!-- Step Indicator -->
      <div class="steps">
        <div class="step done"><span>1</span> Studio</div>
        <div class="step done"><span>2</span> Sport</div>
        <div class="step active"><span>3</span> Room</div>
        <div class="step"><span>4</span> Summary</div>
      </div>

      <section class="flow-section">
        <button class="btn-back" onclick="goBack()">← Back to Sports</button>
        <h3 class="flow-title">Select a Room</h3>
        <p class="flow-subtitle" id="selected-sport-label"></p>

        <!-- Filter  -->
        <div class="filters">
          <label>Date <input type="date" id="filterDate" /></label>
          <label
            >Start Time <input type="time" id="filterStartTime" value="09:00"
          /></label>
          <label
            >End Time <input type="time" id="filterEndTime" value="11:00"
          /></label>
          <label
            >Capacity
            <input type="number" id="filterCapacity" min="1" max="30" value="1"
          /></label>
          <button class="btn-primary" onclick="applyFilters()">Search</button>
          <button class="btn-secondary" onclick="clearFilters()">Clear</button>
        </div>

        <!-- Room List -->
        <div class="room-list" id="room-list"></div>
      </section>
    </main>

    <footer>
      <p>© 2026 SheSparks Wellness | PorWoPor Team</p>
    </footer>

    <!-- ============================================ -->
    <!-- Room Modal-->
    <!-- ============================================ -->
    <div class="room-modal-overlay" id="room-modal">
      <div class="room-modal">

        <button class="room-modal-close" onclick="closeRoomModal()">×</button>

<div class="room-modal-image" id="modal-room-image"></div>

        <!--Room name -->
        <h3 class="room-modal-title" id="modal-room-name">Room A</h3>

        <!-- Date -->
        <div class="room-modal-section">
          <h4>Select Date</h4>
          <div class="date-slots" id="date-slots"></div>
        </div>

        <!-- Time Slot -->
        <div class="room-modal-section">
          <h4>Select Time Slot</h4>
          <div class="time-slots" id="time-slots"></div>
        </div>

        <!-- Capacity -->
        <div class="room-modal-section">
          <h4>Number of People</h4>
          <input
            type="number"
            id="modal-capacity"
            min="1"
            max="30"
            value="1"
            placeholder="1-30"
            style="width: 100%"
          />
        </div>

        <!-- Select -->
        <button
          class="btn-primary room-modal-select"
          id="modal-select-btn"
          onclick="confirmRoomSelection()"
          disabled
        >
          Select
        </button>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/global.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/booking-flow.js"></script>
    <script src="/js/room-modal.js"></script>
  </body>
</html>
