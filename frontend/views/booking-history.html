<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking History - SheSparks</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/navbar.css" />
    <link rel="stylesheet" href="/css/tables.css" />
    <link rel="stylesheet" href="/css/forms.css" />
    <link rel="stylesheet" href="/css/booking-history.css" />
    <link rel="stylesheet" href="/css/modal.css" />
  </head>

  <body>
    <header class="navbar" id="navbar"></header>

    <main>
      <h2 class="section-title">My Booking History</h2>
      <p class="section-subtitle">ประวัติการจองทั้งหมดของคุณ</p>

      <!-- Summary Cards -->
      <section class="summary-cards">
        <div class="card">
          <h3>Total Bookings</h3>
          <p id="totalBookings">0</p>
        </div>
        <div class="card">
          <h3>Total Points</h3>
          <p id="totalPoints">0</p>
        </div>
        <div class="card">
          <h3>Upcoming</h3>
          <p id="upcomingBookings">0</p>
        </div>
        <div class="card">
          <h3>Completed</h3>
          <p id="completedBookings">0</p>
        </div>
      </section>

      <!-- Filter -->
      <section class="report">
        <div class="filters">
          <label
            >Status
            <select id="statusFilter" onchange="filterBookings()">
              <option value="">All</option>
              <option value="Confirmed">Confirmed</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </label>
          <label
            >Date
            <input type="date" id="dateFilter" onchange="filterBookings()" />
          </label>
          <button class="btn-secondary" onclick="clearFilters()">Clear</button>
        </div>

        <!-- Booking Table -->
        <div id="booking-list">
          <table class="booking-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Studio</th>
                <th>Sport</th>
                <th>Room</th>
                <th>Capacity</th>
                <th>Trainer</th>
                <th>Equipment</th>
                <th>Amount</th>
                <th>Points</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="bookingTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer>
      <p>© 2026 SheSparks Wellness | PorWoPor Team</p>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/global.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/booking-history.js"></script>
  </body>
</html>
