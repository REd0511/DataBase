<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SheSparks</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/forms.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>

<body>
    <div class="login-wrapper">
        <div class="login-container">
            <h2>Login to SheSparks</h2>
            <p class="subtitle">Welcome back, beautiful soul ✨</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="memberId">User ID</label>
                    <input type="text" id="memberId" placeholder="M001" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="1234" required>
                </div>

                <button type="submit" class="btn-primary">Login</button>
            </form>

            <div class="hint">
                <strong>Prototype Users:</strong><br>
                Member: <code>M001 / 1234</code><br>
                Admin: <code>A001 / admin</code><br>
                Trainer: <code>T001 / trainer</code><br>
                Manager: <code>S001 / manager</code>
            </div>
        </div>
    </div>

    <script src="/js/data.js"></script>
    <script src="/js/main.js"></script>
</body>

</html>
