<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - Select Sport</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/navbar.css" />
    <link rel="stylesheet" href="/css/booking-flow.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>

<body>
    <header class="navbar" id="navbar"></header>

    <main>
        <h2 class="section-title">Book Your Room</h2>
        <div class="steps">
            <div class="step done"><span>1</span> Studio</div>
            <div class="step active"><span>2</span> Sport</div>
            <div class="step"><span>3</span> Room</div>
            <div class="step"><span>4</span> Summary</div>
        </div>

        <section class="flow-section">
            <button class="btn-back" onclick="goBack()">← Back to Studios</button>
            <h3 class="flow-title">Select a Sport Type</h3>
            <p class="flow-subtitle" id="selected-studio-label"></p>
            <div class="sport-list" id="sport-list"></div>
        </section>
    </main>

    <footer>
        <p>© 2026 SheSparks Wellness | PorWoPor Team</p>
    </footer>


    <script src="/js/data.js"></script>
    <script src="/js/global.js"></script>
    <script src="/js/booking-flow.js"></script>
</body>

</html>
