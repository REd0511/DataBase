<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheSparks Wellness - Home</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/navbar.css" />
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>

<body>
    <!-- Navbar (will be filled by global.js) -->
    <header class="navbar" id="navbar"></header>

    <main>
        <!-- Hero Section with Background Image -->
        <section class="hero">
            <div class="hero-content">
                <h2>Women-Only Sports & Wellness</h2>
                <p>จองห้องซ้อม, ยืมอุปกรณ์, หาเทรนเนอร์หญิง, สมัครคอร์ส และสะสมแต้มแลกรางวัล</p>
                <a href="/views/booking.html" class="btn-primary" id="getStartedBtn">Get Started</a>
            </div>
        </section>

        <!-- Recommendations Section -->
        <section class="recommendations">
            <h2 class="section-title">Recommended for You</h2>

            <!-- Recommended Studios Carousel -->
            <div class="carousel-section">
                <h3>Studios</h3>
                <div class="carousel" id="studio-carousel"></div>
            </div>

            <!-- Recommended Sports Carousel -->
            <div class="carousel-section">
                <h3>Sports</h3>
                <div class="carousel" id="sport-carousel"></div>
            </div>

            <!-- Recommended Courses Carousel -->
            <div class="carousel-section">
                <h3>Courses</h3>
                <div class="carousel" id="course-carousel"></div>
            </div>

            <!-- Recommended Rewards Carousel -->
            <div class="carousel-section">
                <h3>Rewards</h3>
                <div class="carousel" id="reward-carousel"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 SheSparks Wellness | PorWoPor Team</p>
    </footer>

    <!-- Profile Modal -->
    <div class="modal-overlay" id="profile-modal">
        <!-- Content will be injected by global.js -->
    </div>

    <script src="/js/data.js"></script>
    <script src="/js/global.js"></script>
    <script src="/js/home.js"></script>
</body>

</html>
