<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - SheSparks</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- ============================================
         FEATURES:
         - Summary Cards (Total Members, Bookings, Revenue, Points)
         - Report 1: Available rooms/equipment/trainers
         - Report 2: Member points and redemption stats
         - Report 3: Popular courses + monthly revenue
         - Reward Catalog (CRUD)
         - Booking List
         - TODO: Connect to API /api/admin/*
         ============================================ -->
    <header class="navbar">
        <div class="logo">
            <img src="assets/logo.png" alt="SheSparks" width="50">
            <h1>Admin Dashboard</h1>
        </div>
        <nav>
            <a href="admin.html">Dashboard</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>
    </header>

    <main>
        <!-- Summary Cards -->
        <section class="summary-cards">
            <div class="card">
                <h3>Total Members</h3>
                <p id="totalMembers">0</p>
            </div>
            <div class="card">
                <h3>Total Bookings</h3>
                <p id="totalBookings">0</p>
            </div>
            <div class="card">
                <h3>Total Revenue</h3>
                <p id="totalRevenue">฿0</p>
            </div>
            <div class="card">
                <h3>Points Redeemed</h3>
                <p id="totalPointsRedeemed">0</p>
            </div>
        </section>

        <!-- Report 3: Popular Courses -->
        <section class="report">
            <h2>Report 3: Popular Courses</h2>
            <table id="popularCoursesTable">
                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Enrollments</th>
                        <th>Revenue</th>
                    </tr>
                </thead>
                <tbody><!-- render ด้วย JS --></tbody>
            </table>
        </section>

        <!-- Report 1: Available Rooms -->
        <section class="report">
            <h2>Report 1: Available Rooms</h2>
            <div class="filters">
                <label>Date: <input type="date" id="adminDate"></label>
                <label>Start: <input type="time" id="adminStart"></label>
                <label>End: <input type="time" id="adminEnd"></label>
                <button class="btn-primary" onclick="loadAvailableRooms()">Search</button>
            </div>
            <div id="availableRoomsList" class="room-list"></div>
        </section>

        <!-- Report 2: Member Points Summary -->
        <section class="report">
            <h2>Report 2: Member Points Summary</h2>
            <table id="memberPointsTable">
                <thead>
                    <tr>
                        <th>Member</th>
                        <th>Total Earned</th>
                        <th>Total Redeemed</th>
                        <th>Balance</th>
                    </tr>
                </thead>
                <tbody><!-- render ด้วย JS --></tbody>
            </table>
        </section>

        <!-- Reward Catalog -->
        <section class="report">
            <h2>Reward Catalog</h2>
            <button class="btn-primary" onclick="alert('TODO: Add reward form')">+ Add Reward</button>
            <div id="adminRewardList" class="reward-list"></div>
        </section>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
