<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Points - SheSparks</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/points.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <header class="navbar" id="navbar"></header>

    <main>
        <h2 class="section-title">My Loyalty Points</h2>

        <!-- Points Card -->
        <div class="points-card">
            <div class="points-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polygon
                        points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
                    </polygon>
                </svg>
            </div>
            <h3>Total Points</h3>
            <p class="points-value" id="totalPoints">0</p>
            <p class="points-hint">Earn 1 point for every ฿1 spent</p>
            <a href="rewards.html" class="btn-primary">Redeem Rewards</a>
        </div>

        <!-- Transaction History -->
        <div class="points-table-wrap">
            <h3>Transaction History</h3>
            <table id="pointsTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Earned</th>
                        <th>Redeemed</th>
                        <th>Balance</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>

    <footer>
        <p>© 2026 SheSparks Wellness | PorWoPor Team</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/global.js"></script>
    <script src="js/points.js"></script>
</body>

</html>
