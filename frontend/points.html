<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Points - SheSparks</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/points.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <img src="assets/logo.png" alt="SheSparks">
            <h1>My Points</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="booking.html">Booking</a>
            <a href="trainer.html">Trainers</a>
            <a href="course.html">Courses</a>
            <a href="points.html" class="active">Points</a>
            <a href="rewards.html">Rewards</a>
        </nav>
    </header>

    <main>
        <h2 class="section-title">Your Loyalty Points</h2>

        <div class="points-card">
            <h3>Total Points</h3>
            <p class="points-value" id="totalPoints">0</p>
        </div>

        <div class="points-table-wrap">
            <h3>Transaction History</h3>
            <table id="pointsTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Earned</th>
                        <th>Redeemed</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>

    <footer>
        <p>© 2026 SheSparks Wellness | PorWoPor Team</p>
    </footer>

    <script src="js/points.js"></script>

</html>
