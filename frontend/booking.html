<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - SheSparks</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/booking.css">
    <link rel="stylesheet" href="css/booking-flow.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <img src="assets/logo.png" alt="SheSparks">
            <h1>Booking</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="booking.html" class="active">Booking</a>
            <a href="trainer.html">Trainers</a>
            <a href="course.html">Courses</a>
            <a href="points.html">Points</a>
            <a href="rewards.html">Rewards</a>
        </nav>
    </header>

    <main>
        <h2 class="section-title">Book Your Room</h2>

        <!-- Step Indicator -->
        <div class="steps">
            <div class="step active" id="step1-indicator">
                <span>1</span> Studio
            </div>
            <div class="step" id="step2-indicator">
                <span>2</span> Sport
            </div>
            <div class="step" id="step3-indicator">
                <span>3</span> Room
            </div>
            <div class="step" id="step4-indicator">
                <span>4</span> Time
            </div>
        </div>

        <!-- STEP 1: เลือก Studio -->
        <section class="flow-section" id="step1">
            <h3 class="flow-title">Select a Studio</h3>
            <div class="studio-list" id="studio-list"></div>
        </section>

        <!-- STEP 2: เลือก SportType -->
        <section class="flow-section hidden" id="step2">
            <h3 class="flow-title">Select a Sport Type</h3>
            <div class="sport-list" id="sport-list"></div>
        </section>

        <!-- STEP 3: เลือก Room -->
        <section class="flow-section hidden" id="step3">
            <h3 class="flow-title">Select a Room</h3>
            <div class="room-list" id="room-list"></div>
        </section>

        <!-- STEP 4: เลือกวันเวลา + ยืนยัน -->
        <section class="flow-section hidden" id="step4">
            <h3 class="flow-title">Select Date & Time</h3>
            <div class="filters">
                <label>Date <input type="date" id="bookingDate"></label>
                <label>Start <input type="time" id="startTime"></label>
                <label>End <input type="time" id="endTime"></label>
            </div>

            <div class="summary" id="booking-summary">
                <!-- สรุปการจองจะแสดงที่นี่ -->
            </div>

            <button class="btn-primary" onclick="confirmBooking()">Confirm Booking</button>
            <button class="btn-secondary" onclick="resetFlow()">Start Over</button>
        </section>
    </main>

    <footer>
        <p>© 2026 SheSparks Wellness | PorWoPor Team</p>
    </footer>

    <script src="js/booking-data.js"></script>
    <script src="js/booking.js"></script>
</body>
</html>
