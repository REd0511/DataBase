<!DOCTYPE html>
<html lang="en">

<body>

    <main>
        <h2 class="section-title">Available Courses</h2>

        <!-- Filter by Level -->

            <label>Level

                </select>

        <div id="course-list" class="course-list"></div>
    </main>

    <footer>
        <p>© 2026 SheSparks Wellness | PorWoPor Team</p>
    </footer>

    <script src="js/data.js"></script>

</html>
